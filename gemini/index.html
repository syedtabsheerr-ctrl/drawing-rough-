        const worldPt = screenToWorld(sx, sy);

        // Lasso Move / Scale / Draw
        if (state.tool === 'lasso' && state.lassoDragMode) {
          if (state.lassoDragMode === 'draw') {
            const last = state.lassoPath[state.lassoPath.length - 1];
            if (!last || dist(last, worldPt) > 3 / getActiveSheet().camera.scale) {
              state.lassoPath.push(worldPt);
              requestActiveRender();
            }
          } else if (state.lassoDragMode === 'move') {
            const dx = worldPt.x - state.lassoDragStartWorld.x;
            const dy = worldPt.y - state.lassoDragStartWorld.y;
            const sheet = getActiveSheet();
            for (const item of sheet.items) {
              const orig = state.lassoOrigItems.get(item.id);
              if (!orig) continue;
              const clone = JSON.parse(JSON.stringify(orig));
              translateItem(clone, dx, dy);
              Object.assign(item, clone);
            }
            recomputeSelectionBBox();
            requestRender();
          } else if (state.lassoDragMode === 'scale') {
            const ob = state.lassoOrigBBox;
            const ox = ob.minX;
            const oy = ob.minY;
            const origDiag = Math.max(10, Math.hypot(ob.maxX - ob.minX, ob.maxY - ob.minY));
            const curDiag = Math.max(10, Math.hypot(worldPt.x - ox, worldPt.y - oy));
            const factor = curDiag / origDiag;
            const sheet = getActiveSheet();
            for (const item of sheet.items) {
              const orig = state.lassoOrigItems.get(item.id);
              if (!orig) continue;
              scaleItemFromOrigin(orig, item, ox, oy, factor);
            }
            recomputeSelectionBBox();
            requestRender();
          }
          return;
        }

        // Circle Eraser
        if (state.tool === 'circle-eraser' && state.isDrawing) {
          const last = state.lassoPath[state.lassoPath.length - 1];
          if (!last || dist(last, worldPt) > 3 / getActiveSheet().camera.scale) {
            state.lassoPath.push(worldPt);
            requestActiveRender();
          }
          return;
        }

        // Touch Eraser
        if (state.tool === 'touch-eraser' && state.isDrawing) {
          state.eraserCursor = { x: sx, y: sy };
          eraseAtWorldPoint(worldPt);
          requestActiveRender();
          return;
        }

        // Drawing Stroke (renders ONLY on transparent Active Overlay Canvas at 60 FPS)
        if (state.isDrawing && state.currentStroke && !state.snappedCurrent) {
          const pts = state.currentStroke.points;
          const last = pts[pts.length - 1];
          if (!last || dist(last, worldPt) > 1.5 / getActiveSheet().camera.scale) {
            pts.push(worldPt);
            requestActiveRender();
          }
          if (state.holdAnchor && dist(state.holdAnchor, { x: sx, y: sy }) > 6) {
            state.holdAnchor = { x: sx, y: sy };
            startHoldShapeTimer();
          }
        }
      });

      function finishPointer(e) {
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}

        state.activePointers.delete(e.pointerId);

        if (state.isPinching) {
          if (state.activePointers.size === 0) {
            state.isPinching = false;
            scheduleAutoSave();
          }
          return;
        }

        if (state.panStartScreen) {
          state.panStartScreen = null;
          state.panStartCam = null;
          scheduleAutoSave();
          return;
        }

        // Screenshot Crop Finish
        if (state.tool === 'screenshot' && state.isCropping) {
          state.isCropping = false;
          if (state.cropRect) {
            const rw = Math.abs(state.cropRect.x2 - state.cropRect.x1);
            const rh = Math.abs(state.cropRect.y2 - state.cropRect.y1);
            if (rw > 16 && rh > 16) {
              document.getElementById('snapConfirmBtn').classList.remove('hidden');
            } else {
              state.cropRect = null;
            }
          }
          requestActiveRender();
          return;
        }

        // Lasso Finish (Supports both Single-Tap Selection and Circle-to-Select)
        if (state.tool === 'lasso' && state.lassoDragMode) {
          const mode = state.lassoDragMode;
          state.lassoDragMode = null;
          if (mode === 'draw') {
            const poly = state.lassoPath;
            state.lassoPath = [];
            const sheet = getActiveSheet();
            let pathLen = 0;
            for (let i = 1; i < poly.length; i++) pathLen += dist(poly[i - 1], poly[i]);

            if (poly.length > 0 && pathLen < 12 / sheet.camera.scale) {
              // Single-tap selection: pick top-most item under tap
              const tapPt = poly[0];
              const tapRadius = 14 / sheet.camera.scale;
              for (let i = sheet.items.length - 1; i >= 0; i--) {
                const item = sheet.items[i];
                if (item.type === 'image' && sheet.settings.lockMedia) continue;
                if (hitTestItem(item, tapPt, tapRadius)) {
                  state.selectedIds.add(item.id);
                  break;
                }
              }
              recomputeSelectionBBox();
            } else if (poly.length >= 3) {
              for (const item of sheet.items) {
                if (item.type === 'image' && sheet.settings.lockMedia) continue;
                if (itemIntersectsPolygon(item, poly)) {
                  state.selectedIds.add(item.id);
                }
              }
              recomputeSelectionBBox();
            }
            requestActiveRender();
          } else if (mode === 'move' || mode === 'scale') {
            state.lassoOrigItems = null;
            state.lassoOrigBBox = null;
            commitHistory();
          }
          return;
        }

        // Circle / Shape Eraser Finish
        if (state.tool === 'circle-eraser' && state.isDrawing) {
          state.isDrawing = false;
          const poly = state.lassoPath;
          state.lassoPath = [];
          if (poly.length >= 3) {
            const sheet = getActiveSheet();
            const beforeLen = sheet.items.length;
            sheet.items = sheet.items.filter((item) => {
              if (item.type === 'image' && sheet.settings.lockMedia) return true;
              return !itemIntersectsPolygon(item, poly);
            });
            const erasedCount = beforeLen - sheet.items.length;
            if (erasedCount > 0) {
              commitHistory();
              showToast(`Erased ${erasedCount} item${erasedCount > 1 ? 's' : ''}`);
            }
          }
          requestRender();
          return;
        }

        // Touch Eraser Finish
        if (state.tool === 'touch-eraser' && state.isDrawing) {
          state.isDrawing = false;
          state.eraserCursor = null;
          if (state.touchErasedAny) {
            state.touchErasedAny = false;
            commitHistory();
          }
          requestRender();
          return;
        }

        // Drawing Stroke Finish (with 1-tap Revert Snap undo support)
        if (state.isDrawing && state.currentStroke) {
          clearHoldTimer();
          state.isDrawing = false;
          const sheet = getActiveSheet();
          let finalItem = state.currentStroke;
          let rawBefore = state.rawStrokeBeforeSnap;

          if (state.tool === 'shape' && finalItem.type === 'stroke') {
            const snapped = recognizeShapeFromStroke(finalItem);
            if (snapped) {
              rawBefore = finalItem;
              finalItem = snapped;
            }
          }

          if (rawBefore) {
            rawBefore.bbox = computeItemBBox(rawBefore);
            sheet.items.push(rawBefore);
            commitHistory();
            finalItem.bbox = computeItemBBox(finalItem);
            sheet.items[sheet.items.length - 1] = finalItem;
            commitHistory();
          } else {
            finalItem.bbox = computeItemBBox(finalItem);
            sheet.items.push(finalItem);
            commitHistory();
          }

          state.currentStroke = null;
          state.rawStrokeBeforeSnap = null;
          state.snappedCurrent = false;
          requestRender();
        }
      }

      canvas.addEventListener('pointerup', finishPointer);
      canvas.addEventListener('pointercancel', finishPointer);
      canvas.addEventListener('lostpointercapture', finishPointer);

      // Mouse Wheel Zoom (around cursor)
      canvas.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const sx = e.clientX - rect.left;
          const sy = e.clientY - rect.top;
          const sheet = getActiveSheet();
          const worldBefore = screenToWorld(sx, sy);

          const zoomFactor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
          const newScale = Math.max(0.15, Math.min(8, sheet.camera.scale * zoomFactor));
          sheet.camera.scale = newScale;
          sheet.camera.x = worldBefore.x - sx / newScale;
          sheet.camera.y = worldBefore.y - sy / newScale;

          updateZoomLabel();
          scheduleAutoSave();
          requestRender();
        },
        { passive: false }
      );

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
        if (e.code === 'Space') {
          state.spacePressed = true;
          canvas.style.cursor = 'grab';
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
          e.preventDefault();
          redo();
        }
        if (e.key === 'Delete' || e.key === 'Backspace') {
          if (state.selectedIds.size > 0) deleteSelectedItems();
        }
        if (e.key === 'Escape') {
          if (state.tool === 'screenshot') exitScreenshotMode();
          clearSelection();
          closeDrawer();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          state.spacePressed = false;
          updateCanvasCursor();
        }
      });

      window.addEventListener('resize', () => requestRender());

      // --------------------------------------------------------------------------
      // 10. IMAGE & HIGH-DPI PDF IMPORT FOR PRECISION ANNOTATION
      // --------------------------------------------------------------------------
      async function cacheMedia(mediaId, dataUrl) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            mediaCache.set(mediaId, { dataUrl, img });
            resolve(img);
          };
          img.onerror = () => resolve(null);
          img.src = dataUrl;
        });
      }

      async function handleMediaUpload(file) {
        if (!file) return;
        const sheet = getActiveSheet();
        const cam = sheet.camera;
        const viewCenterX = cam.x + canvas.clientWidth / (2 * cam.scale);
        const viewTopY = cam.y + 40 / cam.scale;

        if (file.type === 'application/pdf') {
          if (!window.pdfjsLib) {
            showToast('PDF engine unavailable offline. Connect to internet to import PDFs.');
            return;
          }
          try {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc =
              'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            showToast('Loading PDF...');
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const totalPages = pdf.numPages;

            const renderPages = async (startPage, endPage) => {
              let currentY = viewTopY;
              const targetWorldWidth = Math.min(760, (canvas.clientWidth * 0.85) / cam.scale);
              const count = endPage - startPage + 1;

              for (let p = startPage; p <= endPage; p++) {
                showToast(`Rendering PDF page ${p} of ${endPage}...`);
                const page = await pdf.getPage(p);
                const baseVp = page.getViewport({ scale: 1 });
                const renderScale = Math.min(2.2, 1800 / baseVp.width);
                const vp = page.getViewport({ scale: renderScale });

                const offCanvas = document.createElement('canvas');
                offCanvas.width = Math.round(vp.width);
                offCanvas.height = Math.round(vp.height);
                const offCtx = offCanvas.getContext('2d');
                offCtx.fillStyle = '#ffffff';
                offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);

                await page.render({ canvasContext: offCtx, viewport: vp }).promise;

                const dataUrl = offCanvas.toDataURL('image/jpeg', 0.9);
                const mediaId = uid();
                await dbPut('media', { id: mediaId, dataUrl });
                await cacheMedia(mediaId, dataUrl);

                const aspect = vp.height / vp.width;
                const worldW = targetWorldWidth;
                const worldH = worldW * aspect;

                const item = {
                  id: uid(),
                  type: 'image',
                  mediaId,
                  x: viewCenterX - worldW / 2,
                  y: currentY,
                  width: worldW,
                  height: worldH,
                  pageLabel: `${file.name} — Page ${p}/${totalPages}`
                };
                item.bbox = computeItemBBox(item);
                sheet.items.push(item);

                currentY += worldH + 28;
              }
              commitHistory();
              requestRender();
              showToast(`Imported ${count} PDF page${count > 1 ? 's' : ''}`);
            };

            if (totalPages > 3) {
              const defaultEnd = Math.min(5, totalPages);
              showModal({
                title: `Import PDF (${totalPages} pages)`,
                bodyHtml: `
                  <p class="text-xs text-slate-500 mb-3">Select a page range to keep mobile memory fast:</p>
                  <div class="flex items-center gap-2">
                    <div class="flex-1">
                      <label class="text-[11px] font-semibold text-slate-500 block mb-1">From</label>
                      <input id="pdfStartInput" type="number" min="1" max="${totalPages}" value="1" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-slate-800 text-sm" />
                    </div>
                    <div class="flex-1">
                      <label class="text-[11px] font-semibold text-slate-500 block mb-1">To</label>
                      <input id="pdfEndInput" type="number" min="1" max="${totalPages}" value="${defaultEnd}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-slate-800 text-sm" />
                    </div>
                  </div>
                `,
                actions: [
                  { label: 'Cancel' },
                  {
                    label: 'Import Pages',
                    className: 'px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700',
                    onClick: () => {
                      const s = Math.max(1, Math.min(totalPages, parseInt(document.getElementById('pdfStartInput').value, 10) || 1));
                      const e = Math.max(s, Math.min(totalPages, parseInt(document.getElementById('pdfEndInput').value, 10) || defaultEnd));
                      renderPages(s, e);
                    }
                  }
                ]
              });
            } else {
              await renderPages(1, totalPages);
            }
          } catch (err) {
            console.error(err);
            showToast('Failed to read PDF file.');
          }
        } else if (file.type.startsWith('image/')) {
          try {
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
            const mediaId = uid();
            const img = await cacheMedia(mediaId, dataUrl);
            if (!img) throw new Error('Image load error');
            await dbPut('media', { id: mediaId, dataUrl });

            const maxW = Math.min(680, (canvas.clientWidth * 0.78) / cam.scale);
            const scaleFit = img.width > maxW ? maxW / img.width : 1;
            const worldW = img.width * scaleFit;
            const worldH = img.height * scaleFit;

            const item = {
              id: uid(),
              type: 'image',
              mediaId,
              x: viewCenterX - worldW / 2,
              y: viewTopY,
              width: worldW,
              height: worldH
            };
            item.bbox = computeItemBBox(item);
            sheet.items.push(item);
            commitHistory();
            requestRender();
            showToast('Image added to sheet');
          } catch (err) {
            console.error(err);
            showToast('Failed to import image.');
          }
        }
      }

      // --------------------------------------------------------------------------
      // 11. SCREENSHOT CAPTURE & CONTINUOUS PDF EXPORT
      // --------------------------------------------------------------------------
      function downloadDataUrl(dataUrl, filename) {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function captureScreenshot(rect) {
        const sheet = getActiveSheet();
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const dpr = Math.max(2, window.devicePixelRatio || 1);

        const fullCanvas = document.createElement('canvas');
        fullCanvas.width = Math.round(width * dpr);
        fullCanvas.height = Math.round(height * dpr);
        const fCtx = fullCanvas.getContext('2d');
        fCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        renderStaticScene(fCtx, width, height, sheet);

        if (!rect) {
          downloadDataUrl(fullCanvas.toDataURL('image/png'), `${sheet.name.replace(/\s+/g, '_')}_snap.png`);
          showToast('Screenshot saved!');
          exitScreenshotMode();
          return;
        }

        const rx = Math.max(0, Math.min(rect.x1, rect.x2));
        const ry = Math.max(0, Math.min(rect.y1, rect.y2));
        const rw = Math.min(width - rx, Math.abs(rect.x2 - rect.x1));
        const rh = Math.min(height - ry, Math.abs(rect.y2 - rect.y1));

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = Math.round(rw * dpr);
        cropCanvas.height = Math.round(rh * dpr);
        const cCtx = cropCanvas.getContext('2d');
        cCtx.drawImage(
          fullCanvas,
          Math.round(rx * dpr),
          Math.round(ry * dpr),
          Math.round(rw * dpr),
          Math.round(rh * dpr),
          0,
          0,
          cropCanvas.width,
          cropCanvas.height
        );

        downloadDataUrl(cropCanvas.toDataURL('image/png'), `${sheet.name.replace(/\s+/g, '_')}_crop.png`);
        showToast('Cropped screenshot saved!');
        exitScreenshotMode();
      }

      function exitScreenshotMode() {
        state.cropRect = null;
        state.isCropping = false;
        document.getElementById('screenshotBar').classList.add('hidden');
        document.getElementById('snapConfirmBtn').classList.add('hidden');
        setTool('pen');
      }

      function getContentBounds(sheet) {
        if (sheet.items.length === 0) return null;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const item of sheet.items) {
          const b = item.bbox || (item.bbox = computeItemBBox(item));
          if (b.minX < minX) minX = b.minX;
          if (b.minY < minY) minY = b.minY;
          if (b.maxX > maxX) maxX = b.maxX;
          if (b.maxY > maxY) maxY = b.maxY;
        }
        return { minX, minY, maxX, maxY };
      }

      async function exportToPDF(mode) {
        if (!window.jspdf) {
          showToast('PDF export unavailable offline. Connect to internet to export PDF.');
          return;
        }
        const sheet = getActiveSheet();
        const { jsPDF } = window.jspdf;

        try {
          showToast('Generating PDF...');
          if (mode === 'view') {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            const scale = 2;
            const off = document.createElement('canvas');
            off.width = Math.round(w * scale);
            off.height = Math.round(h * scale);
            const oCtx = off.getContext('2d');
            oCtx.setTransform(scale, 0, 0, scale, 0, 0);
            renderStaticScene(oCtx, w, h, sheet);

            const orientation = w >= h ? 'l' : 'p';
            const pdf = new jsPDF({ orientation, unit: 'px', format: [w, h] });
            pdf.addImage(off.toDataURL('image/jpeg', 0.94), 'JPEG', 0, 0, w, h);
            pdf.save(`${sheet.name.replace(/\s+/g, '_')}_view.pdf`);
            showToast('PDF exported!');
            return;
          }

          // Entire Sheet Content as a Continuous Single-Page PDF (never slices equations)
          const bounds = getContentBounds(sheet);
          if (!bounds) {
            showToast('Sheet is blank — nothing to export.');
            return;
          }

          const pad = 40;
          const contentX = bounds.minX - pad;
          const contentY = bounds.minY - pad;
          const contentW = Math.max(200, bounds.maxX - bounds.minX + pad * 2);
          const contentH = Math.max(200, bounds.maxY - bounds.minY + pad * 2);

          const maxDim = 3200;
          const renderScale = Math.min(2, maxDim / Math.max(contentW, contentH));
          const off = document.createElement('canvas');
          off.width = Math.round(contentW * renderScale);
          off.height = Math.round(contentH * renderScale);
          const oCtx = off.getContext('2d');
          oCtx.setTransform(renderScale, 0, 0, renderScale, 0, 0);

          const virtualSheet = {
            ...sheet,
            camera: { x: contentX, y: contentY, scale: 1 }
          };
          renderStaticScene(oCtx, contentW, contentH, virtualSheet);

          const orientation = contentW >= contentH ? 'l' : 'p';
          const pdf = new jsPDF({
            orientation,
            unit: 'pt',
            format: [contentW, contentH]
          });
          pdf.addImage(off.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, contentW, contentH);
          pdf.save(`${sheet.name.replace(/\s+/g, '_')}.pdf`);
          showToast('Continuous PDF exported!');
        } catch (err) {
          console.error(err);
          showToast('PDF export failed.');
        }
      }

      // --------------------------------------------------------------------------
      function scheduleAutoSave() {
        const status = document.getElementById('saveStatusText');
        if (!dbAvailable) {
          status.textContent = 'Memory only';
          return;
        }
        status.textContent = 'Saving...';
        if (state.saveTimer) clearTimeout(state.saveTimer);
        state.saveTimer = setTimeout(async () => {
          try {
            const sheet = getActiveSheet();
            if (sheet) {
              await dbPut('sheets', sheet);
              await dbPut('meta', { key: 'activeSheetId', value: sheet.id });
            }
            status.textContent = 'Saved locally';
          } catch (_) {
            status.textContent = 'Memory only';
          }
        }, 450);
      }

      async function loadAllFromDB() {
        try {
          const savedSheets = await dbGetAll('sheets');
          const savedMedia = await dbGetAll('media');

          await Promise.all(savedMedia.map((m) => cacheMedia(m.id, m.dataUrl)));

          if (savedSheets.length > 0) {
            state.sheets = savedSheets.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            const meta = await dbGet('meta', 'activeSheetId');
            state.activeSheetId =
              meta && state.sheets.some((s) => s.id === meta.value)
                ? meta.value
                : state.sheets[0].id;
          } else {
            const first = createNewSheetObj('Rough Sheet 1');
            state.sheets = [first];
            state.activeSheetId = first.id;
            await dbPut('sheets', first);
          }
        } catch (_) {
          const first = createNewSheetObj('Rough Sheet 1');
          state.sheets = [first];
          state.activeSheetId = first.id;
        }
      }

      async function exportBackupJSON() {
        try {
          showToast('Preparing backup...');
          const allMedia = dbAvailable
            ? await dbGetAll('media')
            : Array.from(mediaCache.entries()).map(([id, val]) => ({ id, dataUrl: val.dataUrl }));
          const payload = {
            version: 2,
            exportedAt: new Date().toISOString(),
            activeSheetId: state.activeSheetId,
            sheets: state.sheets,
            media: allMedia
          };
          const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          downloadDataUrl(url, `RoughSheet_Backup_${new Date().toISOString().slice(0, 10)}.json`);
          setTimeout(() => URL.revokeObjectURL(url), 3000);
          showToast('Backup JSON downloaded');
        } catch (err) {
          console.error(err);
          showToast('Backup failed');
        }
      }

      async function restoreBackupJSON(file) {
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data.sheets) || data.sheets.length === 0) {
            showToast('Invalid backup file');
            return;
          }
          if (Array.isArray(data.media)) {
            for (const m of data.media) {
              await dbPut('media', m);
              await cacheMedia(m.id, m.dataUrl);
            }
          }
          for (const s of data.sheets) {
            await dbPut('sheets', s);
          }
          state.sheets = data.sheets;
          state.activeSheetId = data.activeSheetId || data.sheets[0].id;
          await dbPut('meta', { key: 'activeSheetId', value: state.activeSheetId });
          state.history.clear();
          initHistoryForSheet(getActiveSheet());
          syncUIFromActiveSheet();
          requestRender();
          showToast(`Restored ${data.sheets.length} sheet(s)!`);
        } catch (err) {
          console.error(err);
          showToast('Could not parse JSON backup');
        }
      }

      function syncUIFromActiveSheet() {
        const sheet = getActiveSheet();
        if (!sheet) return;

        const sel = document.getElementById('sheetSelect');
        sel.innerHTML = '';
        for (const s of state.sheets) {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.name;
          opt.selected = s.id === sheet.id;
          sel.appendChild(opt);
        }

        document.querySelectorAll('.grid-btn').forEach((btn) => {
          const active = btn.dataset.grid === sheet.settings.grid;
          btn.classList.toggle('bg-white', active);
          btn.classList.toggle('shadow-sm', active);
          btn.classList.toggle('text-slate-900', active);
          btn.classList.toggle('text-slate-500', !active);
        });

        applyThemeUI(sheet.settings.theme);

        const lockBtn = document.getElementById('lockMediaToggle');
        if (sheet.settings.lockMedia) {
          lockBtn.classList.remove('bg-slate-300', 'justify-start');
          lockBtn.classList.add('bg-blue-600', 'justify-end');
        } else {
          lockBtn.classList.remove('bg-blue-600', 'justify-end');
          lockBtn.classList.add('bg-slate-300', 'justify-start');
        }

        updateZoomLabel();
        initHistoryForSheet(sheet);
        updateUndoRedoButtons();

      function deleteSelectedItems() {
        const sheet = getActiveSheet();
        if (state.selectedIds.size === 0) return;
        sheet.items = sheet.items.filter((it) => !state.selectedIds.has(it.id));
        clearSelection();
        commitHistory();
        requestRender();
      }

      function duplicateSelectedItems() {
        const sheet = getActiveSheet();
        if (state.selectedIds.size === 0) return;
        const newIds = new Set();
        const offset = 24 / sheet.camera.scale;
        const clones = [];
        for (const item of sheet.items) {
          if (!state.selectedIds.has(item.id)) continue;
          const clone = JSON.parse(JSON.stringify(item));
          clone.id = uid();
          translateItem(clone, offset, offset);
          clones.push(clone);
          newIds.add(clone.id);
        }
        sheet.items.push(...clones);
        state.selectedIds = newIds;
        recomputeSelectionBBox();
        commitHistory();
        requestRender();
        showToast('Duplicated selection');
      }

      function jumpToContent() {
        const sheet = getActiveSheet();
        const bounds = getContentBounds(sheet);
        if (!bounds) {
          sheet.camera = { x: 0, y: 0, scale: 1 };
          updateZoomLabel();
          requestRender();
          showToast('Centered on origin');
          return;
        }
        const cw = bounds.maxX - bounds.minX + 80;
        const ch = bounds.maxY - bounds.minY + 80;
        const scale = Math.max(0.25, Math.min(1.5, Math.min(canvas.clientWidth / cw, canvas.clientHeight / ch)));
        const cx = (bounds.minX + bounds.maxX) / 2;
        const cy = (bounds.minY + bounds.maxY) / 2;
        sheet.camera.scale = scale;
        sheet.camera.x = cx - canvas.clientWidth / (2 * scale);
        sheet.camera.y = cy - canvas.clientHeight / (2 * scale);
        updateZoomLabel();
        scheduleAutoSave();
        requestRender();
      }

            {
              label: 'Current View',
              className: 'px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-white hover:bg-slate-900',
              onClick: () => exportToPDF('view')
            },
            {
              label: 'Entire Content',
              className: 'px-3.5 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700',
              onClick: () => exportToPDF('all')
            }
          ]
        });
      });

      document.getElementById('backupJsonBtn').addEventListener('click', exportBackupJSON);
      const jsonInput = document.getElementById('jsonRestoreInput');
      document.getElementById('restoreJsonBtn').addEventListener('click', () => {
        jsonInput.value = '';
        jsonInput.click();
      });
      jsonInput.addEventListener('change', (e) => {
        if (e.target.files[0]) restoreBackupJSON(e.target.files[0]);
      });

      document.getElementById('clearSheetBtn').addEventListener('click', () => {
        showModal({
          title: 'Clear Current Sheet?',
          bodyHtml: 'This will remove all strokes, shapes, and media on this sheet. You can still Undo this step.',
          actions: [
            { label: 'Cancel' },
            {
              label: 'Clear All',
              className: 'px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 text-white hover:bg-rose-700',
              onClick: () => {
                getActiveSheet().items = [];
                clearSelection();
                commitHistory();
                requestRender();
                closeDrawer();
                showToast('Sheet cleared (Undo available)');
              }
            }
          ]
        });
      });

      // --------------------------------------------------------------------------
      // 15. INITIALIZATION
      // --------------------------------------------------------------------------
      async function boot() {
        await loadAllFromDB();
        syncUIFromActiveSheet();
        requestRender();
        requestAnimationFrame(renderLoop);
      }
      boot();
    })();
  </script>
</body>
</html>
